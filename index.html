<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="layout">

    <!-- ========== PLAYER (chap tomon) ========== -->
    <section class="player">

      <div class="info">
        <div class="cover">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="#fff"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V7h6V3H9z"/></svg>
        </div>
        <div class="texts">
          <span class="number" id="number">1 / 52</span>
          <span class="subtitle">Hozir ijro etilmoqda</span>
          <h1 class="title" id="title">Qo'shiq nomi</h1>
        </div>
      </div>

      <div class="progress">
        <input type="range" id="progress" min="0" max="100" value="0" step="0.1">
        <div class="times">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn small" id="favBtn" title="Sevimlilarga qo'shish">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>
        </button>

        <button class="btn small" id="prevBtn" title="Oldingi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>

        <button class="btn small" id="backBtn" title="10 soniya orqaga">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M4.5 14a8 8 0 1 0 2-8.5L4 10"/></svg>
        </button>

        <button class="btn play" id="playBtn" title="Ijro / Pauza">
          <!-- play ikonkasi -->
          <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <!-- pauza ikonkasi -->
          <svg id="pauseIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>

        <button class="btn small" id="fwdBtn" title="10 soniya oldinga">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4v6h-6"/><path d="M19.5 14a8 8 0 1 1-2-8.5L20 10"/></svg>
        </button>

        <button class="btn small" id="nextBtn" title="Keyingi">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>

        <button class="btn speed" id="speedBtn" title="Tezlik">1x</button>
      </div>

      <!-- Ovoz balandligi -->
      <div class="volume">
        <button class="btn small" id="muteBtn" title="Ovozni o'chirish / yoqish">
          <!-- ovoz bor ikonkasi -->
          <svg id="volOnIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <!-- ovoz yo'q ikonkasi -->
          <svg id="volOffIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="70" step="1">
        <span class="vol-number" id="volNumber">70</span>
      </div>

    </section>

    <!-- ========== QO'SHIQLAR RO'YXATI (o'ng tomon) ========== -->
    <aside class="playlist">
      <h2>Qo'shiqlar ro'yxati</h2>
      <ul id="playlist"></ul>
    </aside>

  </main>

  <!-- Audio elementi (ko'rinmaydi, ovozni shu chalaydi) -->
  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
